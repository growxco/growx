name: Aikido

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scan_scope:
        description: Aikido scan scope
        type: choice
        required: true
        default: dependencies
        options:
          - dependencies
          - all

permissions:
  contents: read

concurrency:
  group: aikido-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  aikido-workspace-gate:
    name: Aikido workspace gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AIKIDO_GATE_REPO: growx
      AIKIDO_GATE_BASELINE_COUNT: "0"
      AIKIDO_GATE_HIGH_BASELINE: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Aikido workspace gate
        env:
          AIKIDO_CLIENT_ID: ${{ secrets.AIKIDO_CLIENT_ID }}
          AIKIDO_CLIENT_SECRET: ${{ secrets.AIKIDO_CLIENT_SECRET }}
          AIKIDO_SCAN_SCOPE: ${{ inputs.scan_scope }}
          AIKIDO_GITHUB_REPOSITORY_ID: ${{ github.event.repository.id }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          OAUTH_URL = "https://app.aikido.dev/api/oauth/token"
          ISSUES_URL = "https://app.aikido.dev/api/public/v1/issues/export"
          REPOSITORIES_URL = "https://app.aikido.dev/api/public/v1/repositories/code"

          def http(method: str, url: str, *, headers=None, data=None, timeout_seconds=30):
              req = urllib.request.Request(url, method=method, headers=headers or {}, data=data)
              try:
                  with urllib.request.urlopen(req, timeout=timeout_seconds) as resp:
                      return resp.status, resp.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read().decode("utf-8", "replace")

          def oauth_token(client_id: str, secret: str) -> str:
              basic = base64.b64encode(f"{client_id}:{secret}".encode()).decode("ascii")
              body = urllib.parse.urlencode({"grant_type": "client_credentials"}).encode()
              status, raw = http(
                  "POST",
                  OAUTH_URL,
                  headers={
                      "Authorization": f"Basic {basic}",
                      "Content-Type": "application/x-www-form-urlencoded",
                      "Accept": "application/json",
                  },
                  data=body,
              )
              if status != 200:
                  raise SystemExit(f"OAuth failed: HTTP {status}")
              return json.loads(raw)["access_token"]

          def collection_items(raw: str):
              data = json.loads(raw)
              if isinstance(data, list):
                  return [item for item in data if isinstance(item, dict)]
              if isinstance(data, dict):
                  for key in ("data", "items", "issues", "results", "repositories"):
                      value = data.get(key)
                      if isinstance(value, list):
                          return [item for item in value if isinstance(item, dict)]
                  if "id" in data:
                      return [data]
              return []

          def object_payload(raw: str):
              data = json.loads(raw)
              if isinstance(data, dict) and isinstance(data.get("data"), dict):
                  return data["data"]
              return data if isinstance(data, dict) else {}

          def manual_scan(token: str, repo: str) -> bool:
              if os.environ.get("GITHUB_EVENT_NAME") != "workflow_dispatch":
                  return True
              if os.environ.get("GITHUB_REF") != "refs/heads/main":
                  print("::error::Manual Aikido scan is restricted to main", flush=True)
                  return False

              github_repo_id = os.environ.get("AIKIDO_GITHUB_REPOSITORY_ID", "").strip()
              if not github_repo_id.isdigit():
                  print("::error::GitHub repository id missing for manual scan", flush=True)
                  return False
              params = urllib.parse.urlencode({
                  "filter_name": repo,
                  "filter_branch": "main",
                  "per_page": 200,
              })
              status, raw = http(
                  "GET",
                  f"{REPOSITORIES_URL}?{params}",
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/json"},
              )
              if status != 200:
                  print(f"::error::Aikido repository lookup failed: HTTP {status}", flush=True)
                  return False
              matches = [
                  item for item in collection_items(raw)
                  if str(item.get("name") or "").lower() == repo
                  and str(item.get("provider") or "").lower() == "github"
                  and str(item.get("branch") or "").lower() == "main"
                  and str(item.get("external_repo_numeric_id") or "") == github_repo_id
              ]
              if len(matches) != 1 or not isinstance(matches[0].get("id"), int):
                  print("::error::Expected exactly one matching Aikido main repository", flush=True)
                  return False

              code_repo_id = matches[0]["id"]
              detail_url = f"{REPOSITORIES_URL}/{code_repo_id}"
              status, raw = http(
                  "GET",
                  detail_url,
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/json"},
              )
              if status != 200:
                  print(f"::error::Aikido repository detail failed: HTTP {status}", flush=True)
                  return False
              previous_scan = object_payload(raw).get("last_scanned_at")
              if not isinstance(previous_scan, int):
                  print("::error::Aikido repository scan timestamp is invalid", flush=True)
                  return False
              scope = os.environ.get("AIKIDO_SCAN_SCOPE", "dependencies")
              query = ""
              if scope == "all":
                  query = "?" + urllib.parse.urlencode({
                      "include_sast_scan": "true",
                      "include_iac_scan": "true",
                      "include_secrets_scan": "true",
                  })
              elif scope != "dependencies":
                  print("::error::Unsupported Aikido scan scope", flush=True)
                  return False

              status, _ = http(
                  "POST",
                  f"{REPOSITORIES_URL}/{code_repo_id}/scan{query}",
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/json"},
                  data=b"",
              )
              if status != 204:
                  print(f"::error::Aikido scan trigger failed: HTTP {status}", flush=True)
                  return False
              print(f"Aikido {scope} scan initiated for main", flush=True)

              # O POST não devolve scan id. Serializamos este workflow por repo/ref
              # e usamos um deadline de parede; o gate abaixo ainda valida o feed.
              deadline = time.monotonic() + 600
              for _ in range(40):
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      break
                  time.sleep(min(15, remaining))
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      break
                  status, raw = http(
                      "GET",
                      detail_url,
                      headers={"Authorization": f"Bearer {token}", "Accept": "application/json"},
                      timeout_seconds=max(1, min(15, remaining)),
                  )
                  if status != 200:
                      print(f"::error::Aikido scan status failed: HTTP {status}", flush=True)
                      return False
                  last_scanned_at = object_payload(raw).get("last_scanned_at")
                  if isinstance(last_scanned_at, int) and last_scanned_at > previous_scan:
                      print("Aikido manual scan completed", flush=True)
                      time.sleep(5)
                      return True
              print("::error::Aikido manual scan timed out after 10 minutes", flush=True)
              return False

          def safe_cell(value, *, fallback="-") -> str:
              if isinstance(value, (dict, list, tuple, set)):
                  return fallback
              text = "".join(
                  character if ord(character) >= 32 and ord(character) != 127 else " "
                  for character in str(value or "")
              )
              text = (
                  text.replace("&", "&amp;")
                  .replace("<", "&lt;")
                  .replace(">", "&gt;")
                  .replace("|", "\\|")
                  .strip()
              )
              return text[:160] if text else fallback

          def main() -> int:
              client_id = os.environ.get("AIKIDO_CLIENT_ID", "").strip()
              secret = os.environ.get("AIKIDO_CLIENT_SECRET", "").strip()
              if not client_id or not secret:
                  is_dependabot_pr = (
                      os.environ.get("GITHUB_EVENT_NAME") == "pull_request"
                      and (
                          os.environ.get("GITHUB_ACTOR") == "dependabot[bot]"
                          or os.environ.get("GITHUB_HEAD_REF", "").startswith("dependabot/")
                      )
                  )
                  if is_dependabot_pr:
                      print(
                          "::notice::Skipping Aikido workspace gate: Dependabot pull_request workflows do not receive repository secrets.",
                          flush=True,
                      )
                      return 0
                  print("::error::AIKIDO_CLIENT_ID / AIKIDO_CLIENT_SECRET missing", flush=True)
                  return 1

              repo = os.environ["AIKIDO_GATE_REPO"].lower()
              critical_baseline = int(os.environ["AIKIDO_GATE_BASELINE_COUNT"])
              high_baseline = int(os.environ["AIKIDO_GATE_HIGH_BASELINE"])
              token = oauth_token(client_id, secret)
              if not manual_scan(token, repo):
                  return 1
              params = urllib.parse.urlencode({
                  "filter_status": "open",
                  "filter_code_repo_name": repo,
                  "per_page": 2000,
              })
              status, raw = http(
                  "GET",
                  f"{ISSUES_URL}?{params}",
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/json"},
              )
              if status != 200:
                  print(f"::error::Aikido issues export failed: HTTP {status}", flush=True)
                  return 1

              seen = set()
              counts = {"critical": 0, "high": 0, "medium": 0, "low": 0}
              details = []
              total = 0
              for item in collection_items(raw):
                  if (item.get("code_repo_name") or "").lower() != repo:
                      continue
                  issue_id = item.get("id")
                  if issue_id in seen:
                      continue
                  seen.add(issue_id)
                  total += 1
                  severity = (item.get("severity") or "unknown").lower()
                  counts[severity] = counts.get(severity, 0) + 1
                  patched_versions = item.get("patched_versions")
                  if isinstance(patched_versions, list):
                      patched_versions = ", ".join(
                          str(version) for version in patched_versions[:5]
                      )

                  # Somente metadados operacionais seguros. Nunca publicar snippets,
                  # evidências, payloads ou campos de segredo do export do provedor.
                  details.append(
                      {
                          "id": safe_cell(issue_id),
                          "severity": safe_cell(severity),
                          "type": safe_cell(item.get("issue_type") or item.get("type")),
                          "rule": safe_cell(item.get("rule")),
                          "cve": safe_cell(item.get("cve_id") or item.get("cve_id_alias")),
                          "target": safe_cell(
                              item.get("affected_package") or item.get("affected_file")
                          ),
                          "file": safe_cell(
                              item.get("affected_file")
                              or item.get("issue_file")
                              or item.get("code_repo_file_path")
                              or item.get("file_path")
                              or item.get("path")
                          ),
                          "installed": safe_cell(item.get("installed_version")),
                          "patched": safe_cell(patched_versions),
                      }
                  )

              severity_order = {"critical": 0, "high": 1, "medium": 2, "low": 3}
              details.sort(key=lambda row: (severity_order.get(row["severity"], 9), row["id"]))
              summary_lines = [
                      "## Aikido gate",
                      "",
                      f"Repo: `{repo}` - Total open: **{total}**",
                      "",
                      "| Severity | Count | Baseline | Status |",
                      "| --- | ---: | ---: | --- |",
                      f"| critical | {counts.get('critical', 0)} | {critical_baseline} | {'OK' if counts.get('critical', 0) <= critical_baseline else 'FAIL'} |",
                      f"| high | {counts.get('high', 0)} | {high_baseline} | {'OK' if counts.get('high', 0) <= high_baseline else 'FAIL'} |",
                      f"| medium | {counts.get('medium', 0)} | (not gated) | -- |",
                      f"| low | {counts.get('low', 0)} | (not gated) | -- |",
                      "",
                      "### Open findings (sanitized)",
                      "",
                      "| ID | Severity | Type | Rule | CVE | Target | File | Installed | Patched |",
                      "| --- | --- | --- | --- | --- | --- | --- | --- | --- |",
              ]
              summary_lines.extend(
                  f"| {row['id']} | {row['severity']} | {row['type']} | {row['rule']} | "
                  f"{row['cve']} | {row['target']} | {row['file']} | {row['installed']} | "
                  f"{row['patched']} |"
                  for row in details
              )
              summary = "\n".join(summary_lines)
              print(summary, flush=True)
              if os.environ.get("GITHUB_STEP_SUMMARY"):
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
                      handle.write(summary + "\n")

              if counts.get("critical", 0) > critical_baseline or counts.get("high", 0) > high_baseline:
                  print("::error::Aikido baseline exceeded", flush=True)
                  return 1
              return 0

          raise SystemExit(main())
          PY
